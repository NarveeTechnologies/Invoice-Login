# Hikari Connection Pool Tuning
logging.level.com.netflix.discovery=ERROR
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.validation-timeout=5000

# Internal service URLs for schema provisioning callbacks
customer.service.internal.url=${CUSTOMER_SERVICE_URL:http://customer:5679}
invoice.service.internal.url=${INVOICE_SERVICE_URL:http://invoice:5671}

# --- JWT claim validation (not secrets; safe to default) -------------------
# Every consumer verifies these on every request. A token minted for another
# issuer or audience is rejected even when the signature is valid.
jwt.issuer=${JWT_ISSUER:invoice-login}
jwt.audience=${JWT_AUDIENCE:invoice-platform}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}

# Shared internal-service key. Empty default = no internal calls permitted;
# both caller and callee fail closed on a blank value. Never commit a real value.
internal.api-key=${INTERNAL_API_KEY:}
