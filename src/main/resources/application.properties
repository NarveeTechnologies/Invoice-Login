spring.application.name=INVOICE-LOGIN-SERVICE

server.port=5678
server.address=0.0.0.0

spring.profiles.active=prod



# ---- Mail ------------------------------------------------------------------
# The host and port were committed values (host.narveetech.com:465) that every
# environment then had to override through SPRING_MAIL_*. They are environment
# variables now, so the deployment declares its own relay instead of correcting
# a compiled-in one. MAIL_HOST has no default deliberately: a mail host guessed
# from source is the fault that pointed UAT at the wrong port for weeks.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
# STARTTLS on 587 is the default. Implicit TLS on 465 needs MAIL_SSL=true and
# MAIL_STARTTLS=false; certificate validation stays on in both cases.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

# Envelope sender. Distinct from spring.mail.username, which authenticates to
# the relay -- the two only coincide by accident.
invoice.mail.from.address=${MAIL_FROM:${MAIL_USERNAME:}}
invoice.mail.from.name=${MAIL_FROM_NAME:Invoice}

# Transport. 'smtp' delivers; 'logging' discards and is refused outside a
# dev/test/local profile by OtpConfigurationGuard.
invoice.mail.provider=${MAIL_PROVIDER:smtp}

# ---- OTP -------------------------------------------------------------------
# Operational limits, all environment-bound. The previous implementation
# hardcoded a two-minute TTL at three call sites and had no ceiling of any kind.
invoice.otp.length=${OTP_LENGTH:6}
invoice.otp.ttl=${OTP_TTL_SECONDS:600}s
invoice.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
invoice.otp.resend-cooldown=${OTP_RESEND_COOLDOWN_SECONDS:60}s
invoice.otp.max-per-identifier-per-hour=${OTP_MAX_PER_IDENTIFIER_PER_HOUR:5}
invoice.otp.max-per-ip-per-hour=${OTP_MAX_PER_IP_PER_HOUR:20}
invoice.otp.retention=${OTP_RETENTION_DAYS:30}d
invoice.otp.cleanup-enabled=${OTP_CLEANUP_ENABLED:true}
# Keys the HMAC over stored passcodes. Mandatory, no default: without it a
# stolen otp_challenges row could be brute-forced offline in milliseconds.
invoice.otp.pepper=${OTP_PEPPER}

# Reverse proxies in front of this service. The per-IP ceiling counts the
# X-Forwarded-For entry immediately before that many trusted hops. 0 uses the
# peer address, which behind a gateway is the same value for every user and so
# puts the whole platform in one bucket; too high trusts an entry the client
# supplied and lets an attacker pick a fresh bucket per request.
# UAT is nginx -> gateway -> login, so 2.
invoice.otp.trusted-proxy-count=${OTP_TRUSTED_PROXY_COUNT:0}

# ---- Flyway ----------------------------------------------------------------
# Flyway owns otp_challenges outright. Invoice-Login had no Flyway at all, so
# the OTP table was whatever ddl-auto=update made of the entity.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=invoice
spring.flyway.default-schema=invoice
# Its own history table. Three services already migrate this one schema and two
# distinct history tables exist in it: Invoice-Service uses
# flyway_schema_history_invoice, and Invoice-Reports-service sets no table name
# so it holds the default flyway_schema_history. A fourth participant sharing
# either would interleave unrelated version numbers.
spring.flyway.table=flyway_schema_history_login
spring.flyway.baseline-on-migrate=true
# Must be 0, and this is not cosmetic. The invoice schema is not empty, so
# baseline-on-migrate writes a baseline marker and then skips every migration at
# or below baseline-version -- whose default is 1. Leaving it defaulted would
# silently skip V001__otp_challenges.sql: Flyway would report success, no table
# would exist, and the first OTP request would fail on a missing relation.
spring.flyway.baseline-version=0


# ---- Outbound URLs ---------------------------------------------------------
# Both were committed, and pointed at two different environments: the login URL
# at the old production hostname, the frontend URL at a developer's localhost.
# Whichever an email happened to use, it was wrong somewhere.
app.login.url=${APP_LOGIN_URL:${APP_FRONTEND_URL:http://localhost:4200}/#/login}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}/#/login


# JWT
# JWT secret (must match Invoice-Login)
jwt.secret=${JWT_SECRET}
# 24 hours in ms
jwt.expiration=86400000

# Was a Windows path, on a service that only ever runs in a Linux container.
file.upload-dir=${UPLOAD_DIR:uploads}/profile


profile.upload-dir=uploads/profile
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Open Session In View --------------------------------------------------
# OFF. Spring Boot defaults it to true and warns about it at every startup.
#
# With it on, an EntityManager is bound to the request thread for the whole
# request and holds a pooled connection until the response is rendered -- not
# until the transaction ends. Any slow work in a request therefore occupies a
# database connection for its full duration, even with no transaction open.
#
# It also hides lazy-loading defects: entities returned straight from a
# controller get their associations loaded during serialisation, which reads as
# working code right up until someone turns this off, and quietly issues extra
# queries per response in the meantime.
#
# Turning it off broke 10 of 20 GET endpoints on the first attempt. All 10 are
# fixed -- see docs/INVOICE_OTP_ARCHITECTURE.md 6c. The three root causes were:
#   * services mapping entities to DTOs outside any transaction
#     -> @Transactional(readOnly = true) on those read methods
#   * entities serialised by Jackson with lazy associations
#     -> @EntityGraph fetch on the finders that feed those endpoints
#   * User.createdBy, a self-referential association Jackson walked into
#     -> @JsonIgnore; no fetch graph can terminate it, and it was disclosing
#        another user's bank details
#
# DO NOT set hibernate.connection.handling_mode to
# DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT as an alternative. It is
# JTA-only; under resource-local transactions writes made through JdbcTemplate
# inside a Spring transaction go back to the pool uncommitted. It silently broke
# OTP single-use -- one passcode logged in three times.
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.idle-timeout=30000
spring.datasource.max-lifetime=1800000
spring.datasource.connection-timeout=20000

