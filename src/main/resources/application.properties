spring.application.name=INVOICE-LOGIN-SERVICE

server.port=5678
server.address=0.0.0.0

spring.profiles.active=prod



# Mail
spring.mail.host=host.narveetech.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:no-reply@narvee.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


#url
app.login.url=http://invoice.narveetech.com/#/login
app.frontend.url=http://localhost:4200/Invoice/#/login
#spring.profiles.active=dev


# JWT
# JWT secret (must match Invoice-Login)
jwt.secret=${JWT_SECRET}
# 24 hours in ms
jwt.expiration=86400000

file.upload-dir=C:/invoice/uploads/profile


profile.upload-dir=uploads/profile
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.idle-timeout=30000
spring.datasource.max-lifetime=1800000
spring.datasource.connection-timeout=20000

# ---- PASTE HERE ----
# Hikari Connection Pool Tuning
logging.level.com.netflix.discovery=ERROR
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.validation-timeout=5000

# Customer DB â€” used by SchemaProvisioningService to create per-tenant schemas
customer.datasource.url=jdbc:postgresql://localhost:5432/Customer
customer.datasource.username=${DB_USERNAME:postgres}
customer.datasource.password=${CUSTOMER_DB_PASSWORD}

# Internal service URLs for schema provisioning callbacks
customer.service.internal.url=${CUSTOMER_SERVICE_URL:http://customer:5679}
invoice.service.internal.url=${INVOICE_SERVICE_URL:http://invoice:5671}

# --- JWT claim validation (not secrets; safe to default) -------------------
# Every consumer verifies these on every request. A token minted for another
# issuer or audience is rejected even when the signature is valid.
jwt.issuer=${JWT_ISSUER:invoice-login}
jwt.audience=${JWT_AUDIENCE:invoice-platform}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}

# Shared internal-service key. Empty default = no internal calls permitted;
# both caller and callee fail closed on a blank value. Never commit a real value.
internal.api-key=${INTERNAL_API_KEY:}
