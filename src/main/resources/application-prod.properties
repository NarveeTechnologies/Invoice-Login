spring.application.name=INVOICE-LOGIN-SERVICE

# Database
# Host and database name come from the environment; the committed value was
# localhost, which is correct on no deployment target we have.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Invoice}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# Mail
# Mail configuration is NOT repeated per profile any more.
#
# This block used to pin host.narveetech.com:465, no-reply@narvee.com, AUTH and
# implicit SSL here -- and because a profile file overrides the base, it silently
# defeated any attempt to configure mail centrally. The UAT Mailpit sink on 1025
# could not be reached however MAIL_HOST was set, because this file had already
# won. Every value now comes from application.properties, which reads the
# environment. Do not reintroduce spring.mail.* here.

# Deliberately NO spring.jpa.properties.hibernate.default_schema.
# Setting it makes Hibernate fully-qualify every table (invoice.user_info),
# which overrides the currentSchema on each per-tenant connection pool and
# silently disables tenant routing. The default pool is pinned to the
# invoice schema in TenantDataSourceConfig instead.
