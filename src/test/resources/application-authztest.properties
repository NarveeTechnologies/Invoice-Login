# Profile for the cross-tenant authorization integration suite.
#
# Named 'authztest' rather than reusing 'test' so it cannot be picked up
# accidentally, and so OtpConfigurationGuard's non-production allowlist has to be
# widened deliberately if this ever needs a different name.
#
# The mail provider is 'logging': these tests exercise *authorization*, not OTP
# delivery. Real SMTP delivery is verified separately end-to-end against Mailpit
# (see docs/INVOICE_IDOR_TENANT_AUDIT.md). Sessions here are minted through the
# application's own JwtServiceImpl, so the token is produced by production code
# with the production tenant claim — what is under test is what the API does
# with a genuine session, not how the session was obtained.
invoice.mail.provider=logging

# Hibernate builds the entity tables; Flyway owns otp_challenges.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=invoice
spring.flyway.default-schema=invoice
spring.flyway.table=flyway_schema_history_login
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Not a real relay; nothing in this suite sends mail.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=no-reply@test.invalid
spring.mail.password=not-used-by-these-tests
invoice.mail.from.address=no-reply@test.invalid

invoice.otp.pepper=authz-integration-test-pepper-32-bytes-min
jwt.secret=authz-integration-test-jwt-secret-at-least-32-bytes
internal.api-key=

logging.level.org.hibernate.SQL=WARN
logging.level.com.invoice=WARN

# The actuator mail health indicator dials the configured relay. There is no
# relay in this suite, so it just contributes SocketTimeoutException noise to
# the log while the tests pass.
management.health.mail.enabled=false
