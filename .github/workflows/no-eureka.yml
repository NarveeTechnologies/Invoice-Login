name: architecture-guard

# Eureka was removed from the Invoice runtime on 2026-09-02 in favour of Docker
# DNS service discovery, and its container and images were deleted from UAT
# after 72/72 end-to-end checks passed without it. This gate stops it coming
# back. Installed in every Invoice repository except Invoice-Eureka-Server,
# which IS the registry and is being archived.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-eureka:
    name: no Eureka in runtime source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on Eureka runtime references
        run: |
          set -uo pipefail
          # Scope: runtime source and configuration only. Documentation and
          # incident evidence legitimately name Eureka and are excluded by
          # path, never by a blanket ignore. Targets are discovered with find
          # rather than a fixed list, so nested module layouts are covered.
          #
          # Comment lines are excluded AFTER grep's "file:line:" prefix. The
          # first version of this gate anchored on ^ instead, which silently
          # never matched, so a comment explaining the removal failed the gate.
          PATTERN='spring-cloud-starter-netflix-eureka|EnableEurekaServer|EnableEurekaClient|EnableDiscoveryClient|eureka\.client|eureka\.instance|eureka\.server|defaultZone|lb://'

          find . \
            \( -name node_modules -o -name target -o -name build -o -name .git -o -name docs \) -prune -o \
            \( -type d -path '*/src/main' -o \
               -type f -name pom.xml -o \
               -type f -name build.gradle -o \
               -type f -name 'docker-compose*.y*ml' -o \
               -type f -name 'Dockerfile*' \) -print0 \
            | xargs -0 -r grep -rInE "$PATTERN" 2>/dev/null \
            | grep -vE ':[0-9]+:[[:space:]]*(#|//|\*|<!--)' > eureka-hits.txt || true

          if [ -s eureka-hits.txt ]; then
            cat eureka-hits.txt
            echo "::error::Eureka / discovery references found in runtime source."
            echo "Invoice uses Docker DNS service discovery. Address services as"
            echo "http://<compose-service-name>:<port>, not lb://SERVICE-ID."
            exit 1
          fi
          echo "OK - no Eureka runtime references"

      - name: Fail on hardcoded container/host IPs in service config
        run: |
          set -uo pipefail
          # Docker DNS must resolve names; baking in an IP breaks on recreate.
          # src/environments is included for the Angular frontend, where the
          # retired 10.10.0.200 host actually lived.
          find . \
            \( -name node_modules -o -name target -o -name build -o -name .git -o -name docs \) -prune -o \
            \( -type d -path '*/src/main/resources' -o \
               -type d -path '*/src/environments' \) -print0 \
            | xargs -0 -r grep -rInE '(^|[^0-9.])(172\.(1[6-9]|2[0-9]|3[01])|10\.|192\.168\.)[0-9.]+' 2>/dev/null \
            | grep -vE ':[0-9]+:[[:space:]]*(#|//|\*)' \
            | grep -v 'allowed-origins' > ip-hits.txt || true

          if [ -s ip-hits.txt ]; then
            cat ip-hits.txt
            echo "::error::Hardcoded private IP in service configuration."
            echo "Use the Docker DNS service name, or an env-overridable value."
            exit 1
          fi
          echo "OK - no hardcoded private IPs"
